name: Build Debian package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper-compat dh-autoreconf autoconf automake \
            autopoint gettext git2cl gobject-introspection intltool \
            libgtk-3-dev liblightdm-gobject-1-dev libx11-dev libtool \
            pkg-config xfce4-dev-tools libayatana-indicator3-dev \
            libayatana-ido3-dev python3 xvfb xauth xdotool dbus-x11 \
            adwaita-icon-theme librsvg2-common
      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b
      - name: Collect package
        run: |
          mkdir -p artifacts
          cp ../lightdm-gtk-greeter_*_*.deb artifacts/
          cd artifacts
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lightdm-gtk-greeter-deb
          path: artifacts/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.deb artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Monolito GTK Greeter $GITHUB_REF_NAME" \
            --notes "Pacote amd64 compilado no Ubuntu 22.04 para Linux Mint 21/22. Inclui o perfil do último usuário com autenticação somente por senha e a opção Outro usuário para credenciais manuais."
